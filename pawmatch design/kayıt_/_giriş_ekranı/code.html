</label>
<label class="z-10 flex cursor-pointer h-full flex-1 items-center justify-center rounded-full px-2 text-sm font-medium leading-normal text-gray-500 hover:text-primary transition-colors">

<input class="invisible w-0 h-0 absolute" name="auth_mode" type="radio" value="signup"/>
</label>
</div>
</div>

<div class="flex flex-col gap-1.5">

<div class="relative flex w-full items-center rounded-xl bg-white border border-transparent focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all duration-200 shadow-sm ring-1 ring-gray-200">
<input class="w-full h-14 bg-transparent border-none rounded-xl pl-4 pr-12 text-base text-gray-800 placeholder:text-gray-400 focus:ring-0" placeholder="ornek@email.com" type="email"/>
<div class="absolute right-4 text-gray-400 flex items-center pointer-events-none">
<span class="material-symbols-outlined" style="font-size: 24px;">mail</span>
</div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-bold text-gray-800 ml-1">Şifre</label>
<div class="relative flex w-full items-center rounded-xl bg-white border border-transparent focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/10 transition-all duration-200 shadow-sm ring-1 ring-gray-200">
<input class="w-full h-14 bg-transparent border-none rounded-xl pl-4 pr-12 text-base text-gray-800 placeholder:text-gray-400 focus:ring-0" placeholder="******" type="password"/>
<button class="absolute right-4 text-gray-400 hover:text-primary transition-colors flex items-center cursor-pointer" type="button">
<span class="material-symbols-outlined" style="font-size: 24px;">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="text-sm font-semibold text-gray-500 hover:text-primary transition-colors" href="#">Şifremi Unuttum?</a>
</div>
<button class="w-full h-14 bg-primary hover:bg-[#5a3524] active:scale-[0.98] transition-all rounded-full text-white font-bold text-lg shadow-[0_4px_12px_rgba(106,63,42,0.25)] mt-2 flex items-center justify-center gap-2" type="button">
<span>Giriş Yap</span>
<span class="material-symbols-outlined" style="font-size: 20px; font-weight: 600;">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center justify-center mb-6">
